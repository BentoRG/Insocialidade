<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Insocialidade — entre ou cadastre-se para jogar." />
    <title>Insocialidade — Entrar</title>
    <link rel="stylesheet" href="css/style.css?v=auth12" />
  </head>
  <body class="auth-page">
    <header class="auth-header">
      <h1 class="auth-title">Insocialidade</h1>
    </header>

    <main class="auth-card">
      <div id="alert" class="alert auth-alert" hidden role="alert"></div>

      <!-- ── Login ─────────────────────────────────────────────────────────── -->
      <section id="login-panel">
        <form id="login-form" class="auth-form" novalidate>
          <div class="form-group">
            <label class="sr-only" for="login-username">Usuário</label>
            <input
              type="text"
              id="login-username"
              class="auth-input auth-input--user"
              name="username"
              autocomplete="username"
              required
              minlength="3"
              maxlength="20"
              placeholder="Seu nome de usuário aqui"
            />
          </div>

          <div class="form-group">
            <label class="sr-only" for="login-password">Senha</label>
            <div class="password-field">
              <input
                type="password"
                id="login-password"
                class="auth-input auth-input--password"
                name="password"
                autocomplete="current-password"
                required
                minlength="4"
                placeholder="Sua senha aqui"
              />
              <button
                type="button"
                class="password-toggle"
                data-target="login-password"
                aria-label="Mostrar senha"
                aria-pressed="false"
                title="Mostrar senha"
              >
                <svg class="password-toggle__icon password-toggle__icon--show" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
                <svg class="password-toggle__icon password-toggle__icon--hide" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 6.5c2.5 0 4.8 1.2 6.5 3.1l1.4-1.4 1.4 1.4-1.9 1.9c1.2 1.6 2 3.6 2.1 5.5l-2 .3c-.1-1.4-.7-2.7-1.6-3.8l-1.6 1.6-1.4-1.4 1.4-1.4C9.2 7.7 7 6.5 4.5 6.5 3.6 6.5 2.7 6.7 1.9 7l-1.9-1.4L1.4 4.2 2.8 2.8C5.2 1.5 8.5.5 12 .5c3.5 0 6.8 1 9.2 2.3l1.4-1.4 1.4 1.4-1.4 1.4C19.3 5.3 21.5 7.8 22.8 10.5l-2 .6c-1-2.2-2.9-4-5.2-5.1l-1.6 1.6-1.4-1.4 1.4-1.4C15.2 7.7 13.6 6.5 12 6.5zm0 3c-1.4 0-2.5 1.1-2.5 2.5S10.6 14.5 12 14.5 14.5 13.4 14.5 12 13.4 9.5 12 9.5zM3.3 3.3 20.7 20.7l-1.4 1.4L1.9 4.7 3.3 3.3z"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn--enter">Entrar</button>
        </form>

        <p class="form-footer">
          Não tem conta?
          <button type="button" id="show-register" class="btn btn--ghost">Cadastre-se</button>
        </p>
      </section>

      <!-- ── Cadastro ──────────────────────────────────────────────────────── -->
      <section id="register-panel" hidden>
        <form id="register-form" class="auth-form" novalidate>
          <div class="form-group">
            <label class="sr-only" for="register-username">Usuário</label>
            <input
              type="text"
              id="register-username"
              class="auth-input auth-input--user"
              name="username"
              autocomplete="username"
              required
              minlength="3"
              maxlength="20"
              placeholder="Seu nome de usuário aqui"
            />
          </div>

          <div class="form-group">
            <label class="sr-only" for="register-password">Senha</label>
            <div class="password-field">
              <input
                type="password"
                id="register-password"
                class="auth-input auth-input--password"
                name="password"
                autocomplete="new-password"
                required
                minlength="4"
                placeholder="Sua senha aqui"
              />
              <button
                type="button"
                class="password-toggle"
                data-target="register-password"
                aria-label="Mostrar senha"
                aria-pressed="false"
                title="Mostrar senha"
              >
                <svg class="password-toggle__icon password-toggle__icon--show" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
                <svg class="password-toggle__icon password-toggle__icon--hide" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92 1.41-1.41-2.92-2.92A4.98 4.98 0 0 0 17 12c0-2.76-2.24-5-5-5-.7 0-1.37.15-1.98.41L9.6 5.98C10.36 5.68 11.16 5.5 12 5.5c4.14 0 7.58 2.72 8.96 6.5-.48 1.2-1.24 2.27-2.2 3.13l1.46 1.46 1.41-1.41L4.2 4.2 2.79 5.61l3.09 3.09A10.78 10.78 0 0 0 1 12c1.73 4.39 6 7.5 11 7.5 1.74 0 3.37-.44 4.8-1.22l2.59 2.59 1.41-1.41-2.59-2.59A10.89 10.89 0 0 0 23 12c-.73-1.85-1.99-3.44-3.57-4.6l1.5-1.5-1.41-1.41-1.5 1.5A10.94 10.94 0 0 0 12 7zm0 3c-1.66 0-3 1.34-3 3 0 .58.17 1.12.45 1.58l4.13-4.13C13.12 10.17 12.58 10 12 10z"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="sr-only" for="register-confirm">Confirmar senha</label>
            <div class="password-field">
              <input
                type="password"
                id="register-confirm"
                class="auth-input auth-input--password"
                name="confirm_password"
                autocomplete="new-password"
                required
                minlength="4"
                placeholder="Sua senha aqui"
              />
              <button
                type="button"
                class="password-toggle"
                data-target="register-confirm"
                aria-label="Mostrar senha"
                aria-pressed="false"
                title="Mostrar senha"
              >
                <svg class="password-toggle__icon password-toggle__icon--show" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
                <svg class="password-toggle__icon password-toggle__icon--hide" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92 1.41-1.41-2.92-2.92A4.98 4.98 0 0 0 17 12c0-2.76-2.24-5-5-5-.7 0-1.37.15-1.98.41L9.6 5.98C10.36 5.68 11.16 5.5 12 5.5c4.14 0 7.58 2.72 8.96 6.5-.48 1.2-1.24 2.27-2.2 3.13l1.46 1.46 1.41-1.41L4.2 4.2 2.79 5.61l3.09 3.09A10.78 10.78 0 0 0 1 12c1.73 4.39 6 7.5 11 7.5 1.74 0 3.37-.44 4.8-1.22l2.59 2.59 1.41-1.41-2.59-2.59A10.89 10.89 0 0 0 23 12c-.73-1.85-1.99-3.44-3.57-4.6l1.5-1.5-1.41-1.41-1.5 1.5A10.94 10.94 0 0 0 12 7zm0 3c-1.66 0-3 1.34-3 3 0 .58.17 1.12.45 1.58l4.13-4.13C13.12 10.17 12.58 10 12 10z"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group form-group--colors">
            <label>Cor do personagem (escolha única)</label>
            <p class="color-warning" role="note">
              <strong>Atenção:</strong> esta cor é <strong>permanente</strong>. Depois do cadastro você
              <strong>não poderá mudá-la</strong>.
            </p>
            <div id="color-grid" class="color-grid" role="radiogroup" aria-label="Cor do personagem"></div>
          </div>

          <button type="submit" class="btn btn--enter">Criar conta</button>
        </form>

        <p class="form-footer">
          Já tem conta?
          <button type="button" id="show-login" class="btn btn--ghost">Entrar</button>
        </p>
      </section>
    </main>

    <script type="module" src="js/index.js?v=auth12"></script>
  </body>
</html>
