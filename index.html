<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Insocialidade — entre ou cadastre-se para jogar." />
    <title>Insocialidade — Entrar</title>
    <link rel="stylesheet" href="css/style.css?v=auth10" />
  </head>
  <body class="auth-page">
    <header class="auth-header">
      <h1 class="auth-title">Insocialidade</h1>
    </header>

    <main class="auth-card">
      <div id="alert" class="alert auth-alert" hidden role="alert"></div>

      <!-- ── Login ─────────────────────────────────────────────────────────── -->
      <section id="login-panel">
        <form id="login-form" class="auth-form" novalidate>
          <div class="form-group">
            <label class="sr-only" for="login-username">Usuário</label>
            <input
              type="text"
              id="login-username"
              class="auth-input auth-input--user"
              name="username"
              autocomplete="username"
              required
              minlength="3"
              maxlength="20"
              placeholder="João_Silva"
            />
          </div>

          <div class="form-group">
            <label class="sr-only" for="login-password">Senha</label>
            <div class="password-field">
              <input
                type="password"
                id="login-password"
                class="auth-input auth-input--password"
                name="password"
                autocomplete="current-password"
                required
                minlength="4"
                placeholder="••••"
              />
              <button
                type="button"
                class="password-toggle"
                data-target="login-password"
                aria-label="Mostrar senha"
                aria-pressed="false"
              >
                <svg class="password-toggle__icon password-toggle__icon--show" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
                </svg>
                <svg class="password-toggle__icon password-toggle__icon--hide" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3.3 3.3 20.7 20.7M10.6 10.6a2 2 0 0 0 2.8 2.8M6.1 6.1C4.2 7.5 2.7 9.5 1 12c1.7 3.9 6 7 11 7 1.5 0 2.9-.3 4.2-.8M9.9 5.1A10.8 10.8 0 0 1 12 5c5 0 9.3 3.1 11 7a11.6 11.6 0 0 1-2.1 3.2"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn--enter">Entrar</button>
        </form>

        <p class="form-footer">
          Não tem conta?
          <button type="button" id="show-register" class="btn btn--ghost">Cadastre-se</button>
        </p>
      </section>

      <!-- ── Cadastro ──────────────────────────────────────────────────────── -->
      <section id="register-panel" hidden>
        <form id="register-form" class="auth-form" novalidate>
          <div class="form-group">
            <label class="sr-only" for="register-username">Usuário</label>
            <input
              type="text"
              id="register-username"
              class="auth-input auth-input--user"
              name="username"
              autocomplete="username"
              required
              minlength="3"
              maxlength="20"
              placeholder="João_Silva"
            />
          </div>

          <div class="form-group">
            <label class="sr-only" for="register-password">Senha</label>
            <div class="password-field">
              <input
                type="password"
                id="register-password"
                class="auth-input auth-input--password"
                name="password"
                autocomplete="new-password"
                required
                minlength="4"
                placeholder="••••"
              />
              <button
                type="button"
                class="password-toggle"
                data-target="register-password"
                aria-label="Mostrar senha"
                aria-pressed="false"
              >
                <svg class="password-toggle__icon password-toggle__icon--show" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
                </svg>
                <svg class="password-toggle__icon password-toggle__icon--hide" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3.3 3.3 20.7 20.7M10.6 10.6a2 2 0 0 0 2.8 2.8M6.1 6.1C4.2 7.5 2.7 9.5 1 12c1.7 3.9 6 7 11 7 1.5 0 2.9-.3 4.2-.8M9.9 5.1A10.8 10.8 0 0 1 12 5c5 0 9.3 3.1 11 7a11.6 11.6 0 0 1-2.1 3.2"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label class="sr-only" for="register-confirm">Confirmar senha</label>
            <div class="password-field">
              <input
                type="password"
                id="register-confirm"
                class="auth-input auth-input--password"
                name="confirm_password"
                autocomplete="new-password"
                required
                minlength="4"
                placeholder="••••"
              />
              <button
                type="button"
                class="password-toggle"
                data-target="register-confirm"
                aria-label="Mostrar senha"
                aria-pressed="false"
              >
                <svg class="password-toggle__icon password-toggle__icon--show" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/>
                </svg>
                <svg class="password-toggle__icon password-toggle__icon--hide" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3.3 3.3 20.7 20.7M10.6 10.6a2 2 0 0 0 2.8 2.8M6.1 6.1C4.2 7.5 2.7 9.5 1 12c1.7 3.9 6 7 11 7 1.5 0 2.9-.3 4.2-.8M9.9 5.1A10.8 10.8 0 0 1 12 5c5 0 9.3 3.1 11 7a11.6 11.6 0 0 1-2.1 3.2"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-group form-group--colors">
            <label>Cor do personagem (escolha única)</label>
            <p class="color-warning" role="note">
              <strong>Atenção:</strong> esta cor é <strong>permanente</strong>. Depois do cadastro você
              <strong>não poderá mudá-la</strong>.
            </p>
            <div id="color-grid" class="color-grid" role="radiogroup" aria-label="Cor do personagem"></div>
          </div>

          <button type="submit" class="btn btn--enter">Criar conta</button>
        </form>

        <p class="form-footer">
          Já tem conta?
          <button type="button" id="show-login" class="btn btn--ghost">Entrar</button>
        </p>
      </section>
    </main>

    <script type="module" src="js/index.js"></script>
  </body>
</html>
